<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monitor public webpages and detect when their content changes.">
    <title>Website Change Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div>
                <h1>Website Change Detector</h1>
                <p class="subtitle">Monitor webpages & detect content changes</p>
            </div>
            <button id="btn-toggle-add" class="btn btn-primary" onclick="toggleElement('add-card')">+ Add Website</button>
        </header>

        <!-- Stats Grid -->
        <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Sites</span>
                <span class="stat-val" id="stat-total">0</span>
            </div>
            <div class="stat-card stat-alert">
                <span class="stat-label">Changed</span>
                <span class="stat-val" id="stat-changed">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Unchanged</span>
                <span class="stat-val" id="stat-unchanged">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Errors</span>
                <span class="stat-val" id="stat-errors">0</span>
            </div>
        </section>

        <!-- Add Website Card (Collapsible) -->
        <section id="add-card" class="card hidden">
            <h3>Monitor a New Website</h3>
            <form id="add-form" onsubmit="handleAddWebsite(event)">
                <div class="form-row">
                    <input type="text" id="site-name" placeholder="Website Name (e.g. Acme Store)" required>
                    <input type="url" id="site-url" placeholder="URL (e.g. https://example.com)" required>
                    <button type="submit" id="btn-submit" class="btn btn-primary">Start Monitoring</button>
                </div>
                <div class="presets">
                    <span>Quick preset:</span>
                    <button type="button" class="btn-preset" onclick="fillForm('Example Domain', 'https://example.com')">🌐 Example.com</button>
                </div>
            </form>
        </section>

        <!-- Monitored Sites Table -->
        <section class="card">
            <div class="table-header">
                <h3>Monitored Websites</h3>
                <input type="text" id="filter-input" placeholder="Search websites..." oninput="filterWebsites()">
            </div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Website</th>
                            <th>Status</th>
                            <th>Message</th>
                            <th>Last Checked</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sites-tbody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
                <div id="empty-state" class="empty-state hidden">
                    <p>No websites monitored yet. Click <strong>+ Add Website</strong> to get started.</p>
                </div>
            </div>
        </section>
    </div>

    <!-- History / Diff Modal -->
    <div id="history-modal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-site-name">Check History</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- History entries rendered here -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
